<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Горилла Обыкновенная — Программа тренировок</title>
<style>
  :root{
    --bg:#111;
    --card:#1a1a1a;
    --card2:#222;
    --accent:#7cc243;
    --accent-dark:#5a9a2e;
    --text:#eee;
    --muted:#999;
    --border:#2e2e2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    padding-bottom:140px; /* место под таймер */
  }
  header{
    background:linear-gradient(135deg,#1e3a2a,#2a4a1e);
    padding:28px 20px 22px;
    text-align:center;
    border-bottom:3px solid var(--accent);
  }
  header h1{
    font-size:clamp(22px,5vw,38px);
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--accent);
  }
  header p{color:#bbb;font-size:14px;margin-top:6px;}
  .reset-btn{
    margin-top:14px;
    background:transparent;
    border:1px solid #555;
    color:#bbb;
    padding:6px 16px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
  }
  .reset-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Вкладки */
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:18px 12px 0;
    max-width:1100px;
    margin:0 auto;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    padding-bottom:12px;
  }
  .tab-btn{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 18px;
    border-radius:24px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap;
  }
  .tab-btn:hover{color:#fff;border-color:#444;}
  .tab-btn.active{
    background:var(--accent);
    color:#111;
    border-color:var(--accent);
  }
  .tab-btn .done-count{
    display:inline-block;
    background:rgba(0,0,0,.15);
    border-radius:10px;
    padding:0 7px;
    font-size:12px;
    margin-left:6px;
  }
  .tab-btn.active .done-count{background:rgba(0,0,0,.2);}

  /* Контент */
  main{max-width:1100px;margin:0 auto;padding:22px 16px;}
  .level-panel{display:none;}
  .level-panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .level-intro{
    background:var(--card);
    border-left:4px solid var(--accent);
    border-radius:8px;
    padding:14px 18px;
    margin-bottom:22px;
    font-size:14.5px;
    color:#ccc;
  }
  .level-intro strong{color:var(--accent);}

  .workout{
    background:var(--card);
    border-radius:12px;
    padding:18px 18px 10px;
    margin-bottom:22px;
    border:1px solid var(--border);
  }
  .workout h3{
    font-size:17px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.5px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .workout h3 .badge{
    background:var(--card2);
    color:var(--muted);
    font-size:12px;
    padding:2px 10px;
    border-radius:12px;
    text-transform:none;
    letter-spacing:0;
  }

  .exercise{
    display:flex;
    gap:12px;
    padding:11px 8px;
    border-radius:8px;
    transition:background .15s;
    align-items:flex-start;
  }
  .exercise:hover{background:#232323;}
  .exercise .check{
    flex:0 0 22px;
    width:22px;
    height:22px;
    border:2px solid #555;
    border-radius:6px;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
    font-size:14px;
    color:transparent;
    cursor:pointer;
    user-select:none;
  }
  .exercise.checked .check{
    background:var(--accent);
    border-color:var(--accent);
    color:#111;
  }
  .exercise .body{flex:1;min-width:0;}
  .exercise .name{
    font-weight:600;
    font-size:15px;
    transition:.2s;
    cursor:pointer;
    user-select:none;
  }
  .exercise .detail{
    font-size:13.5px;
    color:var(--muted);
    margin-top:3px;
    transition:.2s;
    cursor:pointer;
    user-select:none;
  }
  .exercise.checked .name,
  .exercise.checked .detail{
    text-decoration:line-through;
    color:#666;
  }
  .exercise .detail .tech{
    color:#d9a441;
  }
  .exercise .detail .tech::before{content:"⚑ ";}
  .exercise.checked .detail .tech{color:#66552a;}

  /* Заметки */
  .notes-btn{
    background:transparent;
    border:1px dashed #555;
    color:#8fc7e8;
    font-size:12px;
    padding:4px 10px;
    border-radius:8px;
    cursor:pointer;
    margin-top:8px;
    transition:.2s;
  }
  .notes-btn:hover{border-color:#8fc7e8;}
  .notes-btn.has-note{
    border-style:solid;
    border-color:#8fc7e8;
    color:#8fc7e8;
    background:rgba(143,199,232,.08);
  }
  .notes-area{
    display:none;
    margin-top:8px;
    width:100%;
    min-height:56px;
    resize:vertical;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    outline:none;
    transition:.2s;
  }
  .notes-area:focus{border-color:#8fc7e8;}
  .notes-area.open{display:block;}

  /* Прогресс-бар */
  .progress-wrap{
    height:6px;
    background:#2a2a2a;
    border-radius:3px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent-dark),var(--accent));
    border-radius:3px;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--muted);
    text-align:right;
    margin:-16px 0 18px;
  }

  .cardio .exercise .name{color:#8fc7e8;}
  .cardio h3{color:#8fc7e8;}

  /* ===== Плавающий таймер ===== */
  .timer-panel{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#161616ee;
    backdrop-filter:blur(8px);
    border-top:1px solid #333;
    padding:10px 14px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .timer-display{
    font-size:24px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    min-width:76px;
    text-align:center;
    letter-spacing:1px;
  }
  .timer-display.running{color:#f0b85a;}
  .timer-display.finished{color:#e85a5a;animation:blink .6s infinite;}
  @keyframes blink{50%{opacity:.35;}}
  .timer-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .timer-btn{
    background:#262626;
    border:1px solid #3a3a3a;
    color:#ccc;
    padding:6px 12px;
    border-radius:18px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .timer-btn:hover{border-color:var(--accent);color:var(--accent);}
  .timer-btn.stop{
    border-color:#a33;
    color:#e88;
  }
  .timer-btn.stop:hover{background:#3a1a1a;}

  @media(max-width:600px){
    .tab-btn{padding:8px 12px;font-size:13px;}
    .workout{padding:14px 12px 6px;}
    .exercise{padding:10px 4px;}
    .timer-panel{padding:8px 8px;}
    .timer-display{font-size:20px;min-width:64px;}
  }
</style>
</head>

    <button class="timer-btn" data-sec="120">120с</button>
    <button class="timer-btn" data-sec="180">180с</button>
    <button class="timer-btn stop" id="timerStop">Стоп</button>

</div>

/* ================= ХРАНИЛИЩЕ ================= */

const STORAGE_KEY = "gorilla_progress_v2";
const NOTES_KEY   = "gorilla_notes_v1";

let progress = {};
let notes = {};

function loadStorage(){
  try{ progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ progress = {}; }
  try{ notes = JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }catch(e){ notes = {}; }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
function saveNotes(){ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }

function uid(levelId, workoutIdx, exIdx, type){
  return `${levelId}|${type}|${workoutIdx}|${exIdx}`;
}
function isChecked(id){ return !!progress[id]; }
function toggle(id){
  if(progress[id]) delete progress[id];
  else progress[id] = true;
  saveProgress();
  updateCounts();
}
function getNote(id){ return notes[id] || ""; }
function setNote(id, val){
  if(val.trim()) notes[id] = val;
  else delete notes[id];
  saveNotes();
}

/* ================= РЕНДЕР ================= */

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

function buildTabs(){
  tabsEl.innerHTML = "";
  levels.forEach((lv, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.dataset.target = lv.id;
    btn.innerHTML = `${lv.title}<span class="done-count" id="count-${lv.id}">0</span>`;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".level-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(lv.id).classList.add("active");
      window.scrollTo({top:0, behavior:"smooth"});
    });
    tabsEl.appendChild(btn);
  });
}

function buildMain(){
  mainEl.innerHTML = "";
  levels.forEach((lv, i) => {
    const panel = document.createElement("section");
    panel.className = "level-panel" + (i === 0 ? " active" : "");
    panel.id = lv.id;

    const intro = document.createElement("div");
    intro.className = "level-intro";
    intro.innerHTML = `<strong>${lv.title}.</strong> ${lv.intro}`;
    panel.appendChild(intro);

    const pw = document.createElement("div");
    pw.className = "progress-wrap";
    pw.innerHTML = `<div class="progress-bar" id="bar-${lv.id}"></div>`;
    panel.appendChild(pw);

    const pl = document.createElement("div");
    pl.className = "progress-label";
    pl.id = `label-${lv.id}`;
    pl.textContent = "0% выполнено";
    panel.appendChild(pl);

    lv.workouts.forEach((w, wi) => {
      panel.appendChild(buildWorkout(lv.id, w, wi, "workout"));
    });

    if(lv.cardio){
      panel.appendChild(buildWorkout(lv.id, lv.cardio, 0, "cardio"));
    }

    mainEl.appendChild(panel);
  });
}

function buildWorkout(levelId, workout, wi, type){
  const card = document.createElement("div");
  card.className = "workout" + (type === "cardio" ? " cardio" : "");

  const h3 = document.createElement("h3");
  h3.innerHTML = `${workout.name}` + (workout.subtitle ? ` <span class="badge">${workout.subtitle}</span>` : "");
  card.appendChild(h3);

  workout.exercises.forEach((ex, ei) => {
    const id = uid(levelId, wi, ei, type);

    const row = document.createElement("div");
    row.className = "exercise" + (isChecked(id) ? " checked" : "");
    row.dataset.id = id;

    const check = document.createElement("div");
    check.className = "check";
    check.textContent = "✓";
    check.title = "Отметить выполненным";
    check.addEventListener("click", () => {
      toggle(id);
      row.classList.toggle("checked");
    });

    const body = document.createElement("div");
    body.className = "body";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = ex.name;
    name.addEventListener("click", () => {
      toggle(id);
      row.classList.toggle("checked");
    });

    const detail = document.createElement("div");
    detail.className = "detail";
    detail.innerHTML = ex.detail + (ex.tech ? ` <span class="tech">${ex.tech}</span>` : "");
    detail.addEventListener("click", () => {
      toggle(id);
      row.classList.toggle("checked");
    });

    body.appendChild(name);
    body.appendChild(detail);

    // Заметки
    const existingNote = getNote(id);
    const notesBtn = document.createElement("button");
    notesBtn.className = "notes-btn" + (existingNote ? " has-note" : "");
    notesBtn.textContent = existingNote ? "📝 Заметка" : "＋ Заметка";
    notesBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      notesArea.classList.toggle("open");
      if(notesArea.classList.contains("open")){
        notesArea.focus();
        notesArea.selectionStart = notesArea.value.length;
      }
    });

    const notesArea = document.createElement("textarea");
    notesArea.className = "notes-area" + (existingNote ? " open" : "");
    notesArea.placeholder = "Например: 8/8/6 повторов, резина 15 кг…";
    notesArea.value = existingNote;
    notesArea.addEventListener("click", e => e.stopPropagation());
    notesArea.addEventListener("input", () => {
      setNote(id, notesArea.value);
      const has = notesArea.value.trim().length > 0;
      notesBtn.classList.toggle("has-note", has);
      notesBtn.textContent = has ? "📝 Заметка" : "＋ Заметка";
    });

    body.appendChild(notesBtn);
    body.appendChild(notesArea);

    row.appendChild(check);
    row.appendChild(body);
    card.appendChild(row);
  });

  return card;
}

/* ================= СЧЁТЧИКИ ================= */

function updateCounts(){
  levels.forEach(lv => {
    let total = 0, done = 0;
    lv.workouts.forEach((w, wi) => {
      w.exercises.forEach((ex, ei) => {
        total++;
        if(isChecked(uid(lv.id, wi, ei, "workout"))) done++;
      });
    });
    if(lv.cardio){
      lv.cardio.exercises.forEach((ex, ei) => {
        total++;
        if(isChecked(uid(lv.id, 0, ei, "cardio"))) done++;
      });
    }
    const countEl = document.getElementById(`count-${lv.id}`);
    if(countEl) countEl.textContent = `${done}/${total}`;

    const bar = document.getElementById(`bar-${lv.id}`);
    const label = document.getElementById(`label-${lv.id}`);
    if(bar && label){
      const pct = total ? Math.round(done / total * 100) : 0;
      bar.style.width = pct + "%";
      label.textContent = `${pct}% выполнено (${done} из ${total})`;
    }
  });
}

/* ================= СБРОС ================= */

function resetAll(){
  if(!confirm("Сбросить весь прогресс и все заметки?")) return;
  progress = {};
  notes = {};
  saveProgress();
  saveNotes();
  document.querySelectorAll(".exercise").forEach(el => el.classList.remove("checked"));
  document.querySelectorAll(".notes-area").forEach(ta => { ta.value = ""; ta.classList.remove("open"); });
  document.querySelectorAll(".notes-btn").forEach(b => { b.classList.remove("has-note"); b.textContent = "＋ Заметка"; });
  updateCounts();
}

/* ================= ТАЙМЕР ОТДЫХА ================= */

const timerDisplay = document.getElementById("timerDisplay");
const timerStop = document.getElementById("timerStop");
let timerInterval = null;
let remaining = 0;

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }catch(e){ /* без звука, если браузер запретил */ }
}

function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  remaining = 0;
  timerDisplay.textContent = "00:00";
  timerDisplay.classList.remove("running","finished");
}

function startTimer(sec){
  clearInterval(timerInterval);
  remaining = sec;
  timerDisplay.textContent = formatTime(remaining);
  timerDisplay.classList.add("running");
  timerDisplay.classList.remove("finished");

  timerInterval = setInterval(() => {
    remaining--;
    if(remaining <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      timerDisplay.textContent = "00:00";
      timerDisplay.classList.remove("running");
      timerDisplay.classList.add("finished");
      beep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(() => {
        timerDisplay.classList.remove("finished");
      }, 4000);
    } else {
      timerDisplay.textContent = formatTime(remaining);
    }
  }, 1000);
}

document.querySelectorAll(".timer-btn[data-sec]").forEach(btn => {
  btn.addEventListener("click", () => {
    startTimer(parseInt(btn.dataset.sec, 10));
  });
});
timerStop.addEventListener("click", stopTimer);

/* ================= ЗАПУСК ================= */

loadStorage();
buildTabs();
buildMain();
updateCounts();
</script>
